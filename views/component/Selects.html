{#if optionType === 'typeahead'}
    <div class="form-group">
        {#if label}
            <label class="form-label" for="{inputName}">{label}</label>
        {/if}
        <select class="form-control" id="{inputName}" name="{inputName}">
            <option value=""></option>
            {#each options as option}
                <option value="{option.value}" selected="{value === option.value ? 'selected' : ''}">{option.text}</option>
            {/each}
        </select>
    </div>
{:elseif optionType === 'checkbox'}
    <Checkboxes {options} {inputName} {script} {value} {lede} />
{:elseif optionType === 'radio'}
	<NewRadios {options} {inputName} {script} {value} {lede} />
{/if}

<script>
	import Checkboxes from './Checkboxes.html'
	import NewRadios from './NewRadios.html'

	export default {
		data() {
			return {
			}
		},

		components: {
		    Checkboxes,
		    NewRadios
		}
	}
</script>
